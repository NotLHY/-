[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cxr-competition"
version = "0.1.0"
description = "Reproducible study-level multi-label chest X-ray experiments"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "numpy>=2.1,<3",
  "pillow>=10.4,<13",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "timm>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-Pillow>=10"]

[project.scripts]
cxr = "cxr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040", "UP046"]

[tool.mypy]
python_version = "3.12"
files = ["src/cxr"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "sklearn.*", "PIL.*"]
ignore_missing_imports = true
